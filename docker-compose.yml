services:
  # ---------- MySQL (default, no profile => always runs) ----------
  db-mysql:
    image: mysql:8.0
    container_name: sync-event-db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: syncevent_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "user", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - sync-network
    profiles: ["mysql"]

  backend-init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sync-event-init
    environment:
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://user:password@db-mysql:3306/syncevent_db
    networks:
      - sync-network
    depends_on:
      db-mysql:
        condition: service_healthy
    working_dir: /app/apps/backend
    command: >
      sh -c "
          node /app/apps/backend/scripts/check-db.js &&
          pnpm --filter backend exec prisma generate --schema=/app/apps/backend/prisma/schema.prisma &&
          pnpm --filter backend exec prisma db push --schema=/app/apps/backend/prisma/schema.prisma &&
          pnpm --filter backend exec ts-node /app/apps/backend/prisma/seed.ts
        "
    profiles: ["mysql"]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sync-event-backend
    environment:
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://user:password@db-mysql:3306/syncevent_db
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      NODE_ENV: development
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "3000:3000"
    depends_on:
      backend-init:
        condition: service_completed_successfully
    networks:
      - sync-network
    command: >
      sh -c "
        node /app/apps/backend/scripts/check-db.js &&
        pnpm --filter backend exec prisma generate --schema=/app/apps/backend/prisma/schema.prisma &&
        node dist/src/main.js
      "
    profiles: ["mysql"]

  # ---------- PostgreSQL (opt-in via --profile postgres) ----------
  db-postgres:
    image: postgres:16-alpine
    container_name: sync-event-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sync-network
    profiles: ["postgres"]

  backend-init-postgres:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sync-event-init-postgres
    environment:
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - sync-network
    depends_on:
      db-postgres:
        condition: service_healthy
    working_dir: /app/apps/backend
    command: >
      sh -c "
          node /app/apps/backend/scripts/check-db.js &&
          pnpm --filter backend exec prisma generate --schema=/app/apps/backend/prisma/schema.prisma &&
          pnpm --filter backend exec prisma db push --schema=/app/apps/backend/prisma/schema.prisma &&
          pnpm --filter backend exec ts-node /app/apps/backend/prisma/seed.ts
        "
    profiles: ["postgres"]

  backend-postgres:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sync-event-backend-postgres
    environment:
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      NODE_ENV: development
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "3000:3000"
    depends_on:
      backend-init-postgres:
        condition: service_completed_successfully
    networks:
      - sync-network
    command: >
      sh -c "
        node /app/apps/backend/scripts/check-db.js &&
        pnpm --filter backend exec prisma generate --schema=/app/apps/backend/prisma/schema.prisma &&
        node dist/src/main.js
      "
    profiles: ["postgres"]

  # ---------- Frontend (always runs) ----------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sync-event-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - sync-network

networks:
  sync-network:
    driver: bridge

volumes:
  mysqldata:
  pgdata: